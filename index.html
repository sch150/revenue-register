<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Revenue Register</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>

<style>
:root{
  --bg:#f4efe6;
  --bg-2:#fbf8f3;
  --surface:#ffffff;
  --surface-2:#faf7f1;
  --dark:#161319;
  --dark-2:#211d27;
  --dark-3:#2b2632;
  --line:#ece4d6;
  --line-soft:#f1ebe0;
  --line-on-dark:#38323f;
  --text:#241f2b;
  --text-dim:#786f7c;
  --text-faint:#a89fae;
  --text-on-dark:#f6f1ea;
  --text-on-dark-dim:#b6acc0;
  --accent:#8b5cf6;
  --accent-2:#c084fc;
  --accent-ink:#ffffff;
  --pink:#f472b6;
  --amber:#f5b23c;
  --amber-ink:#3a2405;
  --green:#34d399;
  --green-ink:#042c1f;
  --red:#f76c6c;
  --red-ink:#3a0f0f;
  --blue:#60a5fa;
  --gradient: linear-gradient(135deg, #8b5cf6 0%, #c084fc 45%, #f5b23c 100%);
  --radius:20px;
  --radius-sm:12px;
  --shadow: 0 1px 0 rgba(255,255,255,.6) inset, 0 12px 32px rgba(60,40,20,.07), 0 2px 8px rgba(60,40,20,.05);
  --shadow-dark: 0 18px 40px rgba(20,10,30,.35);
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  background:var(--bg);
  color:var(--text);
  font-family:'Inter',sans-serif;
  font-size:14.5px;
  line-height:1.5;
  -webkit-font-smoothing:antialiased;
  position:relative;
  min-height:100vh;
  overflow-x:hidden;
}
body::before{
  content:''; position:fixed; top:-180px; right:-160px; width:560px; height:560px; z-index:0; pointer-events:none;
  background:radial-gradient(circle, #f5b23c 0%, #f472b6 42%, transparent 72%); filter:blur(95px); opacity:.38;
}
body::after{
  content:''; position:fixed; bottom:-220px; left:-160px; width:520px; height:520px; z-index:0; pointer-events:none;
  background:radial-gradient(circle, #8b5cf6 0%, transparent 70%); filter:blur(100px); opacity:.28;
}
h1,h2,h3,h4{font-family:'Outfit',sans-serif; margin:0; color:var(--text); font-weight:600; letter-spacing:-.01em;}
.num, .mono{font-family:'Outfit',sans-serif; font-variant-numeric:tabular-nums; font-weight:600;}
a{color:var(--accent);}
button{font-family:inherit; cursor:pointer;}
input,select,textarea{font-family:inherit; font-size:14px;}
kbd{font-family:'IBM Plex Mono',monospace; background:var(--surface-2); border:1px solid var(--line); border-bottom-width:2px; border-radius:5px; padding:1px 6px; font-size:11.5px; color:var(--accent);}
::selection{background:var(--accent); color:#fff;}
::-webkit-scrollbar{height:10px; width:10px;}
::-webkit-scrollbar-thumb{background:#ddd3c0; border-radius:6px;}
::-webkit-scrollbar-track{background:transparent;}

#app{display:flex; min-height:100vh; position:relative; z-index:1;}
.sidebar{
  width:238px; flex-shrink:0; background:var(--dark); color:var(--text-on-dark);
  margin:16px 0 16px 16px; border-radius:24px; box-shadow:var(--shadow-dark);
  padding:20px 14px; position:sticky; top:16px; height:calc(100vh - 32px); overflow-y:auto; display:flex; flex-direction:column;
}
.brand{display:flex; align-items:center; gap:10px; padding:2px 8px 18px 8px; border-bottom:1px solid var(--line-on-dark); margin-bottom:14px;}
.brand-mark{
  width:38px;height:38px;border-radius:12px; background:var(--gradient);
  display:flex;align-items:center;justify-content:center; font-family:'Outfit',sans-serif; font-weight:700; color:#fff; font-size:14px; flex-shrink:0;
  box-shadow:0 4px 14px rgba(139,92,246,.45);
}
.brand-name{font-family:'Outfit',sans-serif; font-weight:600; font-size:14.5px; line-height:1.25; color:var(--text-on-dark); display:flex; align-items:center; gap:6px;}
.cursor-blink{display:inline-block; width:7px; height:7px; border-radius:50%; background:var(--green); box-shadow:0 0 8px var(--green); animation:pulse 1.8s ease-in-out infinite;}
@keyframes pulse{0%,100%{opacity:1; transform:scale(1);} 50%{opacity:.5; transform:scale(.8);}}
@media (prefers-reduced-motion:reduce){.cursor-blink{animation:none; opacity:1;}}
.brand-sub{font-size:10.5px; letter-spacing:.06em; color:var(--text-on-dark-dim); margin-top:1px; text-transform:uppercase;}

.nav-group{margin-bottom:14px;}
.nav-label{font-size:10px; text-transform:uppercase; letter-spacing:.1em; color:var(--text-on-dark-dim); padding:6px 10px; font-weight:600;}
.nav-btn{
  display:flex; align-items:center; gap:10px; width:100%; text-align:left; padding:10px 12px; border:none; background:none;
  color:var(--text-on-dark-dim); border-radius:999px; font-size:13.5px; margin-bottom:3px; transition:background .15s ease, color .15s ease, transform .12s ease;
}
.nav-btn:hover{background:var(--dark-3); color:var(--text-on-dark); transform:translateX(1px);}
.nav-btn.active{background:var(--gradient); color:#fff; font-weight:600; box-shadow:0 4px 14px rgba(139,92,246,.35);}
.nav-icon{width:16px; text-align:center; opacity:.9; flex-shrink:0;}

.side-foot{margin-top:auto; padding-top:12px; border-top:1px solid var(--line-on-dark);}
.who{font-size:12px; color:var(--text-on-dark); font-weight:600;}
.who-role{font-size:11px; color:var(--text-on-dark-dim);}
.clock{font-family:'IBM Plex Mono',monospace; font-size:11px; color:var(--text-on-dark-dim); margin-top:8px;}
.logout-link{font-size:11.5px; color:var(--accent-2); text-decoration:none; margin-top:6px; display:inline-block;}

.main{flex:1; min-width:0; padding:26px 32px 60px 32px; animation:fadeIn .22s ease; position:relative; z-index:1;}
@keyframes fadeIn{from{opacity:0; transform:translateY(4px);} to{opacity:1; transform:translateY(0);}}
@media (prefers-reduced-motion:reduce){.main{animation:none;}}

.topbar{display:flex; justify-content:space-between; align-items:flex-end; margin-bottom:18px; gap:16px; flex-wrap:wrap;}
.topbar h1{font-size:22px;}
.topbar .subtitle{color:var(--text-dim); font-size:13px; margin-top:4px;}
.topbar-actions{display:flex; gap:10px; align-items:center; flex-wrap:wrap;}

.pill{display:inline-flex; align-items:center; gap:6px; padding:3px 11px; border-radius:99px; font-size:11px; font-weight:600; border:1px solid transparent;}
.pill-green{background:rgba(52,211,153,.12); color:#0f9d6e; border-color:rgba(52,211,153,.3);}
.pill-amber{background:rgba(245,178,60,.14); color:#b3760e; border-color:rgba(245,178,60,.32);}
.pill-red{background:rgba(247,108,108,.12); color:#d94040; border-color:rgba(247,108,108,.3);}
.pill-blue{background:rgba(96,165,250,.12); color:#2f7fe0; border-color:rgba(96,165,250,.3);}

.card{background:var(--surface); border:1px solid var(--line); border-radius:var(--radius); box-shadow:var(--shadow); padding:20px 22px; margin-bottom:18px;}
.card h3{font-size:14.5px; margin-bottom:10px;}
.card-flush{padding:0; overflow:hidden;}

.grid{display:grid; gap:14px;}
.grid-4{grid-template-columns:repeat(4,1fr);}
.grid-3{grid-template-columns:repeat(3,1fr);}
.grid-2{grid-template-columns:repeat(2,1fr);}
@media(max-width:1000px){.grid-4{grid-template-columns:repeat(2,1fr);} .grid-3{grid-template-columns:repeat(2,1fr);}}
@media(max-width:640px){.grid-4,.grid-3,.grid-2{grid-template-columns:1fr;} .main{padding:64px 14px 40px 14px;} .sidebar{position:fixed; z-index:50; margin:0; border-radius:0; height:100vh; top:0; transform:translateX(-100%); transition:transform .2s ease;} .sidebar.open{transform:translateX(0);} #menuBtn{display:inline-flex !important;}}

.stat{padding:18px 20px; position:relative; overflow:hidden; transition:transform .15s ease, box-shadow .15s ease;}
.stat:hover{transform:translateY(-3px); box-shadow:0 16px 34px rgba(60,40,20,.1);}
.stat .label{font-size:11px; text-transform:uppercase; letter-spacing:.07em; color:var(--text-dim); font-weight:600;}
.stat .value{font-family:'Outfit',sans-serif; font-size:24px; margin-top:8px; color:var(--text); font-weight:700;}
.stat .sub{font-size:11.5px; color:var(--text-faint); margin-top:5px;}

table{width:100%; border-collapse:collapse; font-size:13.5px;}
thead th{
  text-align:left; font-size:10.5px; text-transform:uppercase; letter-spacing:.05em; color:var(--text-dim);
  padding:10px 14px; border-bottom:1px solid var(--line); background:var(--surface-2); font-weight:700; white-space:nowrap;
}
tbody td{padding:9px 14px; border-bottom:1px solid var(--line-soft); vertical-align:middle; color:var(--text);}
tbody tr:hover td{background:rgba(139,92,246,.04);}
.right{text-align:right;}
td.right, th.right{text-align:right;}
.muted{color:var(--text-faint);}
.neg{color:var(--red);}
.pos{color:#0f9d6e;}
.table-wrap{overflow-x:auto; border-radius:var(--radius);}

.grid-table td, .grid-table th{border-right:1px solid var(--line-soft);}
.grid-table td:last-child, .grid-table th:last-child{border-right:none;}
.rownum{color:var(--text-faint); font-family:'IBM Plex Mono',monospace; font-size:11.5px; text-align:center; width:34px; background:var(--surface-2);}
.grid-input{
  width:100%; background:var(--surface-2); border:1px solid transparent; border-radius:9px; padding:7px 9px; color:var(--text);
  font-family:'Inter',sans-serif; font-size:13px; transition:border-color .1s ease, background .1s ease, box-shadow .1s ease; text-align:left;
}
.grid-input:hover{border-color:var(--line);}
.grid-input:focus{outline:none; border-color:var(--accent); background:#fff; box-shadow:0 0 0 3px rgba(139,92,246,.15);}
.grid-input[disabled]{opacity:.4;}
.grid-input.f-note{font-family:'Inter',sans-serif;}
select.grid-input{appearance:none; -webkit-appearance:none; background-image:linear-gradient(45deg,transparent 50%,var(--text-faint) 50%),linear-gradient(135deg,var(--text-faint) 50%,transparent 50%); background-position: calc(100% - 14px) center, calc(100% - 9px) center; background-size:5px 5px,5px 5px; background-repeat:no-repeat; padding-right:24px;}
.quick-entry-card{border-top:3px solid transparent; border-image:var(--gradient) 1; box-shadow:0 0 0 1px rgba(139,92,246,.08), var(--shadow);}
.qe-head{display:flex; justify-content:space-between; align-items:center; padding:14px 18px; border-bottom:1px solid var(--line); background:var(--surface-2); flex-wrap:wrap; gap:8px;}
.qe-head h3{font-size:13.5px; display:flex; align-items:center; gap:8px;}
.qe-hint{font-size:12px; color:var(--text-faint);}
tr.quick-entry-row td{background:rgba(139,92,246,.045);}
tr.editing-row td{background:rgba(245,178,60,.08);}

.day-block{border-bottom:2px solid var(--line);}
.day-head-row td{background:var(--surface-2); font-style:italic; color:var(--text-dim); border-top:2px solid var(--line);}
.total-row td{font-weight:700; border-top:1px solid var(--line); background:var(--surface-2); color:var(--text);}
.total-row td.num{color:var(--accent);}
.sign-row td{font-size:12px; color:var(--text-faint); font-style:italic; padding-top:6px; padding-bottom:14px; background:var(--surface);}
.sign-row input[type=text]{background:none; border:none; border-bottom:1px dashed var(--line); color:var(--text); font-family:'Inter',sans-serif; width:170px; padding:2px 0;}
.sign-row input[type=text]:focus{outline:none; border-bottom-color:var(--accent);}

.btn{
  display:inline-flex; align-items:center; gap:6px; padding:9px 16px; border-radius:999px; border:1px solid transparent;
  font-size:13px; font-weight:600; transition:filter .12s ease, background .12s ease, transform .1s ease, border-color .12s ease, box-shadow .12s ease;
}
.btn:active{transform:scale(.97);}
.btn-primary{background:var(--gradient); color:#fff; box-shadow:0 6px 16px rgba(139,92,246,.35);}
.btn-primary:hover{filter:brightness(1.06); box-shadow:0 8px 20px rgba(139,92,246,.45);}
.btn-gold{background:linear-gradient(135deg,#f5b23c,#f6905a); color:#3a2405; box-shadow:0 6px 16px rgba(245,178,60,.3);}
.btn-gold:hover{filter:brightness(1.06);}
.btn-outline{background:var(--surface); border-color:var(--line); color:var(--text);}
.btn-outline:hover{background:var(--surface-2); border-color:var(--text-faint);}
.btn-danger{background:var(--surface); border-color:var(--red); color:var(--red);}
.btn-danger:hover{background:rgba(247,108,108,.08);}
.btn-sm{padding:6px 12px; font-size:12px;}
.btn[disabled]{opacity:.4; cursor:not-allowed;}
.icon-btn{background:none;border:none;padding:5px 8px;border-radius:8px;color:var(--text-faint); font-size:13px;}
.icon-btn:hover{background:var(--surface-2); color:var(--accent);}

.field{display:flex; flex-direction:column; gap:5px; margin-bottom:12px;}
.field label{font-size:12px; font-weight:600; color:var(--text-dim);}
.field .hint{font-size:11px; color:var(--text-faint); font-weight:400;}
.field input, .field select, .field textarea{
  padding:9px 11px; border:1px solid var(--line); border-radius:var(--radius-sm); background:var(--surface-2); color:var(--text); width:100%;
}
.field input:focus, .field select:focus, .field textarea:focus{outline:none; border-color:var(--accent); background:#fff; box-shadow:0 0 0 3px rgba(139,92,246,.14);}
.field-row{display:flex; gap:12px; flex-wrap:wrap;}
.field-row .field{flex:1; min-width:150px;}
.check-field{flex-direction:row; align-items:center; gap:8px;}
.check-field input{width:auto;}

.modal-backdrop{position:fixed; inset:0; background:rgba(30,20,15,.45); backdrop-filter:blur(3px); display:flex; align-items:flex-start; justify-content:center; padding:40px 16px; overflow-y:auto; z-index:100;}
.modal{background:var(--surface); border:1px solid var(--line); border-radius:22px; width:100%; max-width:560px; box-shadow:0 24px 60px rgba(30,15,40,.25); animation:pop .14s ease;}
.modal.wide{max-width:760px;}
@keyframes pop{from{transform:translateY(6px) scale(.99); opacity:0;} to{transform:translateY(0) scale(1); opacity:1;}}
.modal-head{padding:18px 22px; border-bottom:1px solid var(--line); display:flex; justify-content:space-between; align-items:center;}
.modal-head h3{font-size:16px;}
.modal-body{padding:20px 22px;}
.modal-foot{padding:15px 22px; border-top:1px solid var(--line); display:flex; justify-content:space-between; align-items:center; gap:10px;}
.close-x{background:none; border:none; font-size:20px; color:var(--text-faint); line-height:1;}
.close-x:hover{color:var(--text);}

.empty{text-align:center; padding:40px 20px; color:var(--text-faint);}
.empty .big{font-size:30px; margin-bottom:8px; opacity:.7;}

.toast-wrap{position:fixed; top:16px; right:16px; z-index:200; display:flex; flex-direction:column; gap:8px; align-items:flex-end;}
.toast{
  background:var(--surface); border:1px solid var(--line); border-left:4px solid var(--accent); color:var(--text);
  padding:12px 18px; border-radius:14px; font-size:13px; box-shadow:var(--shadow); max-width:320px;
  font-family:'Inter',sans-serif; font-weight:500; animation:slideIn .18s ease;
}
@keyframes slideIn{from{transform:translateX(12px); opacity:0;} to{transform:translateX(0); opacity:1;}}
.toast.err{border-left-color:var(--red);}
.toast.ok{border-left-color:var(--green);}

.tag{display:inline-block; padding:3px 10px; border-radius:99px; font-size:11px; font-weight:600; border:1px solid transparent;}
.tag-agro{background:rgba(52,211,153,.12); color:#0f9d6e; border-color:rgba(52,211,153,.28);}
.tag-vet{background:rgba(96,165,250,.12); color:#2f7fe0; border-color:rgba(96,165,250,.28);}
.tag-vaccine{background:rgba(244,114,182,.12); color:#d6398f; border-color:rgba(244,114,182,.28);}
.tag-warehouse{background:rgba(245,178,60,.14); color:#b3760e; border-color:rgba(245,178,60,.3);}
.tag-default{background:var(--surface-2); color:var(--text-faint);}

.section-intro{color:var(--text-dim); font-size:13px; margin-bottom:16px; max-width:640px;}
.lock-screen{max-width:380px; margin:80px auto; text-align:center;}
.divider{height:1px; background:var(--line); margin:18px 0;}
.hidden{display:none !important;}
.mono-sm{font-family:'IBM Plex Mono',monospace; font-size:12px; color:var(--text-dim);}
#menuBtn{display:none; background:var(--dark); color:#fff; border:none; border-radius:999px; padding:9px 14px; position:fixed; top:14px; left:14px; z-index:60; box-shadow:var(--shadow-dark);}
.helper-list{margin:0; padding-left:18px; font-size:13px; color:var(--text-dim);}
.helper-list li{margin-bottom:5px;}
code{background:var(--surface-2); padding:1px 7px; border-radius:6px; font-size:12.5px; font-family:'IBM Plex Mono',monospace; color:var(--accent);}
.sync-dot{width:7px;height:7px;border-radius:50%; display:inline-block;}
.sync-ok{background:var(--green); box-shadow:0 0 6px var(--green);}
.sync-off{background:var(--text-faint);}
.sync-err{background:var(--red);}

.login-wrap{min-height:100vh; display:flex; align-items:center; justify-content:center; padding:24px; position:relative; z-index:1;}
.login-card{background:var(--surface); border:1px solid var(--line); border-radius:26px; padding:32px 30px; width:100%; max-width:360px; box-shadow:var(--shadow);}
.user-picker{display:flex; flex-direction:column; gap:8px; margin-top:18px;}
.user-pick{display:flex; align-items:center; gap:12px; padding:11px 14px; background:var(--surface-2); border:1px solid var(--line); border-radius:16px; color:var(--text); text-align:left; transition:border-color .12s ease, background .12s ease, transform .12s ease; width:100%;}
.user-pick:hover{border-color:var(--accent); background:#fff; transform:translateY(-1px); box-shadow:0 8px 18px rgba(139,92,246,.12);}
.user-avatar{width:36px;height:36px;border-radius:50%; background:var(--gradient); display:flex; align-items:center; justify-content:center; font-family:'Outfit',sans-serif; color:#fff; font-weight:600; font-size:12px; flex-shrink:0;}

.crumbs{display:flex; align-items:center; gap:6px; font-size:12.5px; color:var(--text-dim); margin-bottom:14px; flex-wrap:wrap;}
.crumbs button{background:none; border:none; color:var(--accent); font-size:12.5px; padding:0; font-weight:600;}
.crumbs button:hover{text-decoration:underline;}
.crumb-sep{color:var(--text-faint);}
.drill-card{cursor:pointer; transition:transform .12s ease, box-shadow .12s ease;}
.drill-card:hover{transform:translateY(-3px); box-shadow:0 16px 34px rgba(60,40,20,.1);}
.seg{display:inline-flex; border:1px solid var(--line); border-radius:999px; overflow:hidden; background:var(--surface-2);}
.seg button{padding:7px 14px; background:none; color:var(--text-dim); border:none; font-size:12.5px; font-weight:600;}
.seg button.active{background:var(--gradient); color:#fff;}
.banner{display:flex; justify-content:space-between; align-items:center; gap:12px; padding:13px 18px; border-radius:16px; background:rgba(245,178,60,.12); border:1px solid rgba(245,178,60,.3); color:#a3690a; font-size:13px; margin-bottom:16px; flex-wrap:wrap;}

</style>
</head>
<body>

<button id="menuBtn" onclick="document.querySelector('.sidebar')?.classList.toggle('open')">&#9776; Menu</button>

<div id="app"></div>
<div class="toast-wrap" id="toastWrap"></div>

function uid(){ return Date.now().toString(36)+Math.random().toString(36).slice(2,8); }
function todayStr(){ return new Date().toISOString().slice(0,10); }
function money(n){
  n = Number(n)||0;
  const neg = n < 0;
  const s = Math.abs(n).toLocaleString('en-GH',{minimumFractionDigits:2, maximumFractionDigits:2});
  return (neg? '(':'') + s + (neg? ')':'');
}
function fmtDate(d){
  if(!d) return '';
  const dt = new Date(d+'T00:00:00');
  if(isNaN(dt)) return d;
  return dt.toLocaleDateString('en-GB',{day:'2-digit',month:'short',year:'numeric'});
}
function deptTag(dept){
  const map = {'Agro Chemicals':'tag-agro','Veterinary':'tag-vet','Vaccines':'tag-vaccine','Warehouse':'tag-warehouse'};
  const cls = map[dept] || 'tag-default';
  return `<span class="tag ${cls}">${esc(dept||'—')}</span>`;
}
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function parseMoney(v){
  if(v===null||v===undefined) return 0;
  if(typeof v==='number') return isNaN(v)? 0 : v;
  let s = String(v).trim();
  if(!s) return 0;
  let neg = false;
  if(/^\(.*\)$/.test(s)){ neg = true; s = s.slice(1,-1); }
  if(/^-/.test(s)) neg = true;
  s = s.replace(/[^0-9.]/g,'');
  const n = parseFloat(s);
  if(isNaN(n)) return 0;
  return neg ? -Math.abs(n) : n;
}
function initials(name){ return (name||'?').trim().split(/\s+/).slice(0,2).map(w=>w[0]||'').join('').toUpperCase(); }

function defaultState(){
  return {
    meta:{ businessName:'Revenue Register', lastSyncedAt:null, lastLocalBackupAt:null },
    sync:{ url:'', secret:'' },
    departments: DEPARTMENTS_DEFAULT.slice(),
    branches: [],
    users: [],
    coa:{
      banks: COA_BANKS_DEFAULT.map(a=>({...a,id:uid()})),
      momo: COA_MOMO_DEFAULT.map(a=>({...a,id:uid()})),
      cash: COA_CASH_DEFAULT.map(a=>({...a,id:uid()})),
    },
    entries: [],
    dayMeta: {},
    customers: [],
    debtorAdjustments: [],
    deposits: [],
    momoConfirmations: [],
    bankStatementLines: [],
  };
}

function loadState(){
  let s;
  try{
    const raw = localStorage.getItem(STORAGE_KEY);
    if(!raw){ s = defaultState(); }
    else{
      const parsed = JSON.parse(raw);
      const d = defaultState();
      s = Object.assign(d, parsed, {
        meta: Object.assign(d.meta, parsed.meta||{}),
        sync: Object.assign(d.sync, parsed.sync||{}),
        coa: Object.assign(d.coa, parsed.coa||{}),
      });
    }
  }catch(e){ console.error('load failed', e); s = defaultState(); }

  // --- migrations: ensure a branch exists, backfill branchId, migrate old single-PIN admin ---
  if(!s.branches || !s.branches.length){
    s.branches = [{id:uid(), name:'Main Branch', code:'MAIN'}];
  }
  const firstBranch = s.branches[0].id;
  (s.entries||[]).forEach(e=>{ if(!e.branchId) e.branchId = firstBranch; if(!e.chequeDetails) e.chequeDetails = []; if(!e.multipleCheques) e.multipleCheques='N'; });
  (s.customers||[]).forEach(c=>{ if(!c.branchId) c.branchId = firstBranch; });
  (s.deposits||[]).forEach(d=>{ if(!d.branchId) d.branchId = firstBranch; });
  (s.momoConfirmations||[]).forEach(m=>{ if(!m.branchId) m.branchId = firstBranch; });
  if(!s.debtorAdjustments) s.debtorAdjustments = [];
  if(!s.bankStatementLines) s.bankStatementLines = [];
  (s.deposits||[]).forEach(d=>{ if(d.bankConfirmed===undefined) d.bankConfirmed=false; if(d.bankConfirmedDate===undefined) d.bankConfirmedDate=null; });
  (s.entries||[]).forEach(e=>{ (e.chequeDetails||[]).forEach(cd=>{ if(cd.dishonoured===undefined) cd.dishonoured=false; }); });
  if(!s.users) s.users = [];
  if(!s.users.length && s.meta && s.meta.pin){
    s.users.push({id:uid(), name:'Admin', role:'admin', branchId:null, pin:s.meta.pin});
  }
  return s;
}
function saveState(){ localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); }
function mutate(fn){ fn(state); saveState(); render(); }
function mutateSilent(fn){ fn(state); saveState(); }

/* ================= entries / balance calc (per branch) ================= */
function sortedEntries(branchId){
  return state.entries.filter(e=>e.branchId===branchId).sort((a,b)=>{
    if(a.date !== b.date) return a.date < b.date ? -1 : 1;
    return (a.seq||0) - (b.seq||0);
  });
}
function groupByDate(list){
  const out = [];
  let cur = null;
  for(const e of list){
    if(!cur || cur.date !== e.date){ cur = {date:e.date, rows:[]}; out.push(cur); }
    cur.rows.push(e);
  }
  return out;
}
function computeLedger(branchId){
  const days = groupByDate(sortedEntries(branchId));
  const result = [];
  for(const day of days){
    let running = 0; // daily closure: each day starts fresh, no carry-forward
    const openBalance = 0;
    let cashTotal=0, chequeTotal=0;
    const rows = day.rows.map(e=>{
      running += (e.cash||0) + (e.cheque||0);
      cashTotal += (e.cash||0);
      chequeTotal += (e.cheque||0);
      return Object.assign({}, e, {balance:running});
    });
    result.push({date:day.date, rows, openBalance, cashTotal, chequeTotal, closeBalance:running});
  }
  return result;
}
function dayMetaKey(branchId,date){ return branchId+'__'+date; }

  if(!el) return;
  const now = new Date();
  el.textContent = now.toLocaleDateString('en-GB',{weekday:'short',day:'2-digit',month:'short'}) + ' · ' + now.toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit'});
}

function animateStats(){
  const reduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  document.querySelectorAll('.count-target').forEach(el=>{
    const final = parseFloat(el.dataset.final)||0;
    const isInt = el.dataset.int === '1';
    if(reduce){ el.textContent = isInt? Math.round(final).toLocaleString('en-GH') : money(final); return; }
    const start = performance.now();
    const dur = 650;
    function step(t){
      const p = Math.min(1,(t-start)/dur);
      const eased = 1-Math.pow(1-p,3);
      el.textContent = isInt? Math.round(final*eased).toLocaleString('en-GH') : money(final*eased);
      if(p<1) requestAnimationFrame(step);
    }
    requestAnimationFrame(step);
  });
}

function completeAdminSetup(){
  const name = (document.getElementById('setupName').value||'').trim();
  const pin = (document.getElementById('setupPin').value||'').trim();
  if(!name || !pin){ toast('Enter your name and a PIN','err'); return; }
  const id = uid();
  mutateSilent(s=>{ s.users.push({id, name, role:'admin', branchId:null, pin}); });
  ui.currentUserId = id;
  ui.currentBranchId = state.branches[0]?.id || null;
  render();
}
function attemptLogin(){
  const pin = (document.getElementById('loginPin').value||'').trim();
  const u = state.users.find(x=>x.id===ui.pendingLoginUserId);
  if(u && pin && pin===u.pin){
    ui.currentUserId = u.id; ui.pendingLoginUserId = null;
    ui.currentBranchId = u.branchId || state.branches[0]?.id || null;
    render();
  } else { toast('Incorrect PIN','err'); }
}

          <button class="btn btn-outline btn-sm" onclick="goTab('cheques')">Cheques register</button>
        </div>
      </div>
      <div class="card">
        <h3>Recent days</h3>
        <table>
          <thead><tr><th>Date</th><th class="right">Cash</th><th class="right">Cheque</th><th class="right">Closing balance</th></tr></thead>
          <tbody>
          ${recentDays.length? recentDays.map(d=>`
            <tr><td>${fmtDate(d.date)}</td><td class="right num">${money(d.cashTotal)}</td><td class="right num">${money(d.chequeTotal)}</td><td class="right num" style="font-weight:700;color:var(--accent);">${money(d.closeBalance)}</td></tr>

    </div>` : ''}

function branchSwitcherHTML(){
  return `<select class="grid-input" style="width:auto;" onchange="ui.currentBranchId=this.value; render();">
    ${state.branches.map(b=>`<option value="${b.id}" ${b.id===ui.currentBranchId?'selected':''}>${esc(b.name)}</option>`).join('')}

/* ================= REGISTER (spreadsheet-style grid, per branch) ================= */
const GRID_COLS = 9;

function tabRegister(){
  const branchId = activeBranchId();
  if(!branchId){ return `<div class="empty">No branch available. Ask an Admin to create one under Branches.</div>`; }
  const ledger = computeLedger(branchId).slice().reverse();
  return `
    <div class="topbar">
      <div><h1>Daily Register</h1><div class="subtitle">${esc(branchName(branchId))} · Type a line, hit <kbd>Enter</kbd>, keep going · balance closes and resets each day</div></div>
      <div class="topbar-actions">
        ${isAdmin()? branchSwitcherHTML() : ''}
        <button class="btn btn-outline" onclick="exportRegisterCsv()">Export CSV</button>
      </div>
    </div>

    <div class="card card-flush quick-entry-card">
      <div class="qe-head">
        <h3>⌨ Quick entry</h3>
        <div class="qe-hint">Press <kbd>Enter</kbd> in any field to save the line and start the next one</div>
      </div>
      <div class="table-wrap">
        <table class="grid-table">
          <thead>${gridHeaderRow()}</thead>
          <tbody>${entryRowEditor(draftEntryObject(), {mode:'draft'})}</tbody>
        </table>
      </div>
    </div>
    <datalist id="customerListGrid">${state.customers.filter(c=>c.branchId===branchId).map(c=>`<option value="${esc(c.name)}">`).join('')}</datalist>

    <div class="card card-flush">
      <div class="table-wrap">
        <table class="grid-table">
          <thead>${gridHeaderRow()}</thead>
          <tbody>
          ${ledger.length? ledger.map(day=>renderDayBlock(day, branchId)).join('') : `<tr><td colspan="${GRID_COLS}" class="empty"><div class="big">▤</div>No register entries yet for this branch — use the quick entry grid above.</td></tr>`}
          </tbody>
        </table>
      </div>
    </div>
  `;
}
function gridHeaderRow(){
  return `<tr>
    <th style="width:34px;">#</th><th>Date</th><th>Type</th><th>Department / customer</th>
    <th class="right">Cash</th><th class="right">Cheque</th><th class="right">Day total</th><th>Note</th><th></th>
  </tr>`;
}
function draftEntryObject(){
  return {id:null, date: ui.draftDate||todayStr(), lineType: ui.draftType||'sale', department:'', customer:'', cash:'', cheque:'', note:''};
}
function deptCustCellHTML(lt, deptVal, customerVal){
  if(lt.needsDept){
    return `<select class="grid-input f-dept">${state.departments.map(dep=>`<option ${dep===deptVal?'selected':''}>${esc(dep)}</option>`).join('')}</select>`;
  }
  if(lt.needsCustomer){
    return `<input class="grid-input f-customer" list="customerListGrid" placeholder="Customer name" value="${esc(customerVal||'')}">`;
  }
  if(lt.id==='other'){
    return `<select class="grid-input f-sign"><option value="+" ${customerVal!=='-'?'selected':''}>Add to balance (+)</option><option value="-" ${customerVal==='-'?'selected':''}>Deduct (−)</option></select>`;
  }
  return `<span class="muted">—</span>`;
}
function getPendingChequeDetails(token){
  if(token==='draft') return ui.draftChequeDetails||[];
  if(ui.editChequeDetails.hasOwnProperty(token)) return ui.editChequeDetails[token]||[];
  const e = state.entries.find(x=>x.id===token);
  return e? (e.chequeDetails||[]) : [];
}
function getPendingMultiFlag(token){
  if(token==='draft') return ui.draftMultipleCheques||'N';
  if(ui.editMultipleCheques.hasOwnProperty(token)) return ui.editMultipleCheques[token]||'N';
  const e = state.entries.find(x=>x.id===token);
  return e? (e.multipleCheques||'N') : 'N';
}
function chequeCellHTML(token, lt){
  const details = getPendingChequeDetails(token);
  const total = details.reduce((s,d)=>s+(parseFloat(d.amount)||0),0);
  const label = details.length? `${money(total)} · ${details.length} chq` : '+ Add cheque';
  return `<button type="button" id="cheque-btn-${token}" class="grid-input" style="text-align:right; cursor:pointer;" onclick="openChequeDetailsModal('${token}')">${label}</button>`;
}

function entryRowEditor(entry, opts){
  const isDraft = opts.mode === 'draft';
  const lt = LINE_TYPES.find(l=>l.id===entry.lineType) || LINE_TYPES[0];
  const rowClass = isDraft ? 'quick-entry-row' : 'editing-row';
  const token = isDraft ? 'draft' : entry.id;
  const keyMode = isDraft ? 'draft' : ('edit:'+entry.id);
  const numVal = v => (v===''||v==null) ? '' : Math.abs(v);
  const otherSignVal = lt.id==='other' ? (entry.cash<0 || entry.cheque<0 ? '-' : '+') : '';
  let chequeCell;
  if(lt.id==='other'){
    chequeCell = `<input type="number" step="0.01" min="0" class="grid-input f-cheque num" placeholder="${lt.chequeLabel||'—'}" value="${numVal(entry.cheque)}">`;
  } else if(lt.chequeLabel){
    chequeCell = chequeCellHTML(token, lt);
  } else {
    chequeCell = `<input type="number" class="grid-input f-cheque num" disabled placeholder="—">`;
  }
  return `<tr class="${rowClass}" data-token="${token}" onkeydown="handleRowKeydown(event,this,'${keyMode}')">
    <td class="rownum">${isDraft? '+' : '·'}</td>
    <td><input type="date" class="grid-input f-date" value="${entry.date}"></td>
    <td><select class="grid-input f-type" onchange="refreshDeptCustCell(this)">
      ${LINE_TYPES.map(l=>`<option value="${l.id}" ${l.id===entry.lineType?'selected':''}>${l.short}</option>`).join('')}
    </select></td>
    <td class="dept-cust-cell">${deptCustCellHTML(lt, entry.department, lt.id==='other'? otherSignVal : entry.customer)}</td>
    <td><input type="number" step="0.01" min="0" class="grid-input f-cash num" placeholder="${lt.cashLabel||'Amount'}" value="${numVal(entry.cash)}"></td>
    <td class="cheque-cell">${chequeCell}</td>
    <td class="right num muted">—</td>
    <td><input type="text" class="grid-input f-note" placeholder="optional note" value="${esc(entry.note||'')}"></td>
    <td class="right" style="white-space:nowrap;">
      ${isDraft
        ? `<button class="btn btn-primary btn-sm" onclick="commitDraftRow(this.closest('tr'))">Add ↵</button>`
        : `<button class="btn btn-primary btn-sm" onclick="saveInlineEdit('${entry.id}', this.closest('tr'))">Save</button> <button class="icon-btn" onclick="cancelInlineEdit()">✕</button>`}
    </td>
  </tr>`;
}

function refreshDeptCustCell(selectEl){
  const tr = selectEl.closest('tr');
  const token = tr.dataset.token;
  const lt = LINE_TYPES.find(l=>l.id===selectEl.value) || LINE_TYPES[0];
  tr.querySelector('.dept-cust-cell').innerHTML = deptCustCellHTML(lt, state.departments[0], '');
  const cashInput = tr.querySelector('.f-cash');
  cashInput.placeholder = lt.cashLabel || 'Amount';
  const chequeTd = tr.querySelector('.cheque-cell');
  if(lt.id==='other'){
    chequeTd.innerHTML = `<input type="number" step="0.01" min="0" class="grid-input f-cheque num" placeholder="${lt.chequeLabel}">`;
  } else if(lt.chequeLabel){
    if(token==='draft'){ ui.draftChequeDetails=[]; ui.draftMultipleCheques='N'; }
    else { ui.editChequeDetails[token] = []; ui.editMultipleCheques[token] = 'N'; }
    chequeTd.innerHTML = chequeCellHTML(token, lt);
  } else {
    chequeTd.innerHTML = `<input type="number" class="grid-input f-cheque num" disabled placeholder="—">`;
  }
}

function handleRowKeydown(e, trEl, mode){
  if(e.key !== 'Enter') return;
  if(e.target.tagName === 'TEXTAREA') return;
  e.preventDefault();
  if(mode === 'draft') commitDraftRow(trEl);
  else saveInlineEdit(mode.slice(5), trEl);
}

function readRowValues(trEl){
  const lineType = trEl.querySelector('.f-type').value;
  const lt = LINE_TYPES.find(l=>l.id===lineType) || LINE_TYPES[0];
  const date = trEl.querySelector('.f-date').value;
  const cell = trEl.querySelector('.dept-cust-cell');
  const department = lt.needsDept ? (cell.querySelector('.f-dept')?.value || '') : '';
  const customerTyped = lt.needsCustomer ? (cell.querySelector('.f-customer')?.value.trim() || '') : '';
  const otherSign = lt.id==='other' ? (cell.querySelector('.f-sign')?.value || '+') : '+';
  let cash = parseFloat(trEl.querySelector('.f-cash').value)||0;
  let cheque = 0, chequeDetails = [];
  const token = trEl.dataset.token;
  if(lt.id==='other'){
    cheque = parseFloat(trEl.querySelector('.f-cheque').value)||0;
  } else if(lt.chequeLabel){
    chequeDetails = getPendingChequeDetails(token);
    cheque = chequeDetails.reduce((s,d)=>s+(parseFloat(d.amount)||0),0);
  }
  const note = trEl.querySelector('.f-note').value.trim();
  if(lt.sign === -1){ cash = -Math.abs(cash); cheque = cheque? -Math.abs(cheque):0; }
  else { cash = Math.abs(cash); cheque = Math.abs(cheque); }
  if(lt.id==='other' && otherSign==='-'){ cash = -Math.abs(cash); cheque = -Math.abs(cheque); }
  return {date, lineType, department, customerTyped, cash, cheque, note, chequeDetails, multipleCheques: getPendingMultiFlag(token)};
}

function commitDraftRow(trEl){
  const v = readRowValues(trEl);
  const lt = LINE_TYPES.find(l=>l.id===v.lineType);
  if(!v.date){ toast('Pick a date first','err'); return; }
  if(!v.cash && !v.cheque){ toast('Enter a cash or cheque amount','err'); return; }
  if(lt.needsCustomer && !v.customerTyped){ toast('Enter a customer name','err'); return; }
  const branchId = activeBranchId();
  if(!branchId){ toast('No branch selected','err'); return; }
  let newCustomerCreated = null;
  mutate(s=>{
    let customerId = null, customerName = '';
    if(lt.needsCustomer){
      const existing = s.customers.find(c=> c.branchId===branchId && c.name.trim().toLowerCase()===v.customerTyped.trim().toLowerCase());
      if(existing){ customerId = existing.id; customerName = existing.name; }
      else{
        customerId = uid(); customerName = v.customerTyped.trim();
        s.customers.push({id:customerId, name:customerName, branchId, department:v.department||'', contact:'', balance:0, notes:'Auto-created from register entry', createdAt:v.date});
        newCustomerCreated = customerName;
      }
    }
    s.entries.push({
      id:uid(), seq:Date.now(), date:v.date, branchId, lineType:v.lineType, department:v.department,
      customerId, customer:customerName, cash:v.cash, cheque:v.cheque, note:v.note,
      chequeDetails:v.chequeDetails, multipleCheques:v.multipleCheques,
    });
  });
  ui.draftDate = v.date; ui.draftType = v.lineType;
  ui.draftChequeDetails = []; ui.draftMultipleCheques = 'N';
  toast(newCustomerCreated? `Line added · new debtor "${newCustomerCreated}" created` : 'Line added', 'ok');
}

function startInlineEdit(id){
  const entry = state.entries.find(e=>e.id===id);
  ui.editingEntryId = id;
  ui.editChequeDetails[id] = (entry.chequeDetails||[]).map(d=>({...d}));
  ui.editMultipleCheques[id] = entry.multipleCheques || (entry.chequeDetails && entry.chequeDetails.length>1 ? 'Y':'N');
  render();
  const el=document.querySelector('.editing-row .f-type'); if(el) setTimeout(()=>el.focus(),20);
}
function cancelInlineEdit(){
  if(ui.editingEntryId){ delete ui.editChequeDetails[ui.editingEntryId]; delete ui.editMultipleCheques[ui.editingEntryId]; }
  ui.editingEntryId = null; render();
}
function saveInlineEdit(id, trEl){
  const v = readRowValues(trEl);
  const lt = LINE_TYPES.find(l=>l.id===v.lineType);
  if(!v.date){ toast('Pick a date first','err'); return; }
  if(!v.cash && !v.cheque){ toast('Enter a cash or cheque amount','err'); return; }
  if(lt.needsCustomer && !v.customerTyped){ toast('Enter a customer name','err'); return; }
  mutate(s=>{
    const entry = s.entries.find(e=>e.id===id);
    const branchId = entry.branchId;
    let customerId = null, customerName = '';
    if(lt.needsCustomer){
      const existing = s.customers.find(c=> c.branchId===branchId && c.name.trim().toLowerCase()===v.customerTyped.trim().toLowerCase());
      if(existing){ customerId = existing.id; customerName = existing.name; }
      else{
        customerId = uid(); customerName = v.customerTyped.trim();
        s.customers.push({id:customerId, name:customerName, branchId, department:v.department||'', contact:'', balance:0, notes:'Auto-created from register entry', createdAt:v.date});
      }
    }
    Object.assign(entry, {date:v.date, lineType:v.lineType, department:v.department, customerId, customer:customerName, cash:v.cash, cheque:v.cheque, note:v.note, chequeDetails:v.chequeDetails, multipleCheques:v.multipleCheques});
  });
  delete ui.editChequeDetails[id]; delete ui.editMultipleCheques[id];
  ui.editingEntryId = null;
  toast('Line updated','ok');
}
function deleteEntry(id){
  if(!confirm('Delete this register entry? This cannot be undone.')) return;
  mutate(s=>{ s.entries = s.entries.filter(e=>e.id!==id); });
  toast('Entry deleted');
}

function renderDayBlock(day, branchId){
  const dm = state.dayMeta[dayMetaKey(branchId,day.date)] || {};
  let html = `<tr class="day-head-row">
    <td></td><td>${fmtDate(day.date)}</td><td colspan="2">Day opens — daily closure (balance resets each day)</td>
    <td class="right num"></td><td class="right num"></td><td class="right num">0.00</td><td></td><td></td>
  </tr>`;
  day.rows.forEach((r,i)=>{
    if(r.id === ui.editingEntryId){ html += entryRowEditor(r, {mode:'edit'}); return; }
    html += `<tr>
      <td class="rownum">${i+1}</td>
      <td class="mono-sm">${fmtDate(r.date)}</td>
      <td>${esc((LINE_TYPES.find(l=>l.id===r.lineType)||{}).short||r.lineType)}</td>
      <td>${r.department? deptTag(r.department) : (r.customer? esc(r.customer) : `<span class="muted">—</span>`)}</td>
      <td class="right num ${r.cash<0?'neg':(r.cash>0?'pos':'')}">${r.cash?money(r.cash):''}</td>
      <td class="right num ${r.cheque<0?'neg':(r.cheque>0?'pos':'')}">${r.cheque? `<a href="#" onclick="viewChequeDetails('${r.id}');return false;">${money(r.cheque)}</a>` : ''}</td>
      <td class="right num" style="font-weight:600;">${money(r.balance)}</td>
      <td class="muted">${esc(r.note||'')}</td>
      <td class="right" style="white-space:nowrap;"><button class="icon-btn" title="Edit" onclick="startInlineEdit('${r.id}')">✎</button><button class="icon-btn" title="Delete" onclick="deleteEntry('${r.id}')">✕</button></td>
    </tr>`;
  });
  html += `<tr class="total-row"><td></td><td></td><td colspan="2">TOTAL</td><td class="right num">${money(day.cashTotal)}</td><td class="right num">${money(day.chequeTotal)}</td><td class="right num">${money(day.closeBalance)}</td><td></td><td></td></tr>`;
  html += `<tr class="sign-row"><td></td><td colspan="8">
    Recorded by: <input type="text" value="${esc(dm.recordedBy||'')}" placeholder="staff name" onchange="setDayMeta('${branchId}','${day.date}','recordedBy',this.value)">
    &nbsp;&nbsp;
    <label><input type="checkbox" ${dm.signed?'checked':''} onchange="setDayMeta('${branchId}','${day.date}','signed',this.checked)"> Signed off</label>
  </td></tr>`;
  return html;
}
function setDayMeta(branchId, date, key, val){
  mutate(s=>{ const k=dayMetaKey(branchId,date); s.dayMeta[k] = Object.assign({}, s.dayMeta[k]||{}, {[key]:val}); });
}
function exportRegisterCsv(){
  const branchId = activeBranchId();
  const rows = [['Date','Type','Department','Customer','Cash','Cheque','Note','DayRunningTotal']];
  computeLedger(branchId).forEach(day=>{
    day.rows.forEach(r=>{ rows.push([r.date, r.lineType, r.department||'', r.customer||'', r.cash, r.cheque, r.note||'', r.balance]); });
  });
  downloadCsv(rows, `revenue-register-${(branchName(branchId)||'branch').replace(/\s+/g,'-')}.csv`);
}

/* ---- cheque details mini-modal (doesn't disturb the grid row underneath) ---- */
function openChequeDetailsModal(token){
  const tr = document.querySelector(`tr[data-token="${token}"]`);
  const rowDate = tr.querySelector('.f-date').value || todayStr();
  const cell = tr.querySelector('.dept-cust-cell');
  const custInput = cell.querySelector('.f-customer');
  const defaultDrawer = custInput? custInput.value : '';
  const existing = getPendingChequeDetails(token);
  ui.chequeModalToken = token;
  ui.chequeModalDraft = existing.length? existing.map(d=>({...d})) : [{id:uid(), receiptDate:rowDate, drawer:defaultDrawer, bank:'', chequeNumber:'', amount:'', dueDate:''}];
  ui.chequeModalMulti = getPendingMultiFlag(token) || (existing.length>1?'Y':'N');
  ui.modal = {type:'chequeDetails'};
  renderModal();
}
function syncChequeModalDraftFromDOM(){
  const rows = document.querySelectorAll('#chequeModalTable tbody tr');
  const arr = [];
  rows.forEach(tr=>{
    arr.push({
      id: tr.dataset.id,
      receiptDate: tr.querySelector('.cd-date').value,
      drawer: tr.querySelector('.cd-drawer').value,
      bank: tr.querySelector('.cd-bank').value,
      chequeNumber: tr.querySelector('.cd-number').value,
      amount: tr.querySelector('.cd-amount').value,
      dueDate: tr.querySelector('.cd-due').value,
    });
  });
  ui.chequeModalDraft = arr;
  const checked = document.querySelector('input[name="cd-multi"]:checked');
  if(checked) ui.chequeModalMulti = checked.value;
}
function addChequeDetailRow(){
  syncChequeModalDraftFromDOM();
  ui.chequeModalDraft.push({id:uid(), receiptDate: ui.chequeModalDraft[0]?.receiptDate || todayStr(), drawer:'', bank:'', chequeNumber:'', amount:'', dueDate:''});
  renderModal();
}
function removeChequeDetailRow(id){
  syncChequeModalDraftFromDOM();
  ui.chequeModalDraft = ui.chequeModalDraft.filter(d=>d.id!==id);
  if(!ui.chequeModalDraft.length) ui.chequeModalDraft.push({id:uid(), receiptDate:todayStr(), drawer:'', bank:'', chequeNumber:'', amount:'', dueDate:''});
  renderModal();
}
function onChequeMultiChange(val){
  syncChequeModalDraftFromDOM();
  if(val==='N' && ui.chequeModalDraft.length>1){
    if(!confirm('Switching to a single cheque will discard the extra cheque rows. Continue?')){ renderModal(); return; }
    ui.chequeModalDraft = [ui.chequeModalDraft[0]];
  }
  ui.chequeModalMulti = val;
  renderModal();
}
function saveChequeDetailsModal(){
  syncChequeModalDraftFromDOM();
  const cleaned = ui.chequeModalDraft.filter(d=> (parseFloat(d.amount)||0) > 0);
  if(!cleaned.length){ toast('Add at least one cheque with an amount','err'); return; }
  for(const d of cleaned){ if(!d.dueDate){ toast('Each cheque needs a due date for presentation','err'); return; } }
  const token = ui.chequeModalToken;
  if(token==='draft'){ ui.draftChequeDetails = cleaned; ui.draftMultipleCheques = ui.chequeModalMulti; }
  else { ui.editChequeDetails[token] = cleaned; ui.editMultipleCheques[token] = ui.chequeModalMulti; }
  ui.modal = null; ui.chequeModalDraft=null; ui.chequeModalToken=null;
  removeModal();
  const btn = document.getElementById('cheque-btn-'+token);
  if(btn){ const total = cleaned.reduce((s,d)=>s+(parseFloat(d.amount)||0),0); btn.textContent = `${money(total)} · ${cleaned.length} chq`; }
  toast('Cheque details saved','ok');
}
function closeChequeDetailsModal(){ ui.modal=null; ui.chequeModalDraft=null; ui.chequeModalToken=null; removeModal(); }
function viewChequeDetails(entryId){ ui.modal = {type:'chequeView', entryId}; render(); }

function tabDepartments(){
  return `
    <div class="topbar">
      <div><h1>Departments</h1><div class="subtitle">Sales departments used across the register, debtors and reports</div></div>
      <div class="topbar-actions"><button class="btn btn-primary" onclick="addDepartmentPrompt()">+ Add department</button></div>
    </div>
    <div class="card card-flush">
      <table>
        <thead><tr><th>Department</th><th class="right">Entries recorded</th><th></th></tr></thead>
        <tbody>
        ${state.departments.map(dep=>{
          const count = state.entries.filter(e=>e.department===dep).length;
          return `<tr><td>${deptTag(dep)}</td><td class="right num">${count}</td>
          <td class="right"><button class="icon-btn" onclick="removeDepartment('${esc(dep)}')" title="Remove">✕</button></td></tr>`;

function addDepartmentPrompt(){
  const name = prompt('New department name:');

}
function removeDepartment(name){
  if(!confirm(`Remove "${name}" from departments? Existing entries keep their history.`)) return;
  mutate(s=>{ s.departments = s.departments.filter(d=>d!==name); });
}

/* ================= DEBTORS (cascading: all -> branch -> department) ================= */
function computeDebtorLedger(customerId){
  const c = state.customers.find(x=>x.id===customerId);
  if(!c) return {movements:[], balance:0};
  const movements = [{date:c.createdAt||'', type:'Opening balance', ref:'', amount:parseMoney(c.balance)}];
  state.entries.filter(e=>e.customerId===customerId && PAYMENT_LINE_TYPES.includes(e.lineType)).forEach(e=>{
    const amt = Math.abs(e.cash||0)+Math.abs(e.cheque||0);
    movements.push({date:e.date, type: PAYMENT_TYPE_LABELS[e.lineType]||'Payment on account', ref:e.note||'', amount:-amt});
  });
  state.debtorAdjustments.filter(a=>a.customerId===customerId).forEach(a=>{
    movements.push({date:a.date, type:'Adjustment'+(a.note? ' — '+a.note:''), ref:'', amount: a.type==='increase'? Math.abs(a.amount) : -Math.abs(a.amount)});
  });
  movements.sort((a,b)=> (a.date||'')<(b.date||'') ? -1 : 1);
  let running = 0;
  const withBalance = movements.map(m=>{ running += m.amount; return Object.assign({},m,{balance:running}); });
  return {movements: withBalance, balance: running};
}

function normalizeHeader(s){ return String(s).trim().toLowerCase().replace(/[_\-]+/g,' ').replace(/\s+/g,' '); }
function pickField(row, names){
  const keys = Object.keys(row||{});
  for(const want of names){
    const wantNorm = normalizeHeader(want);
    const key = keys.find(k=> normalizeHeader(k) === wantNorm);
    if(key !== undefined && row[key] !== undefined && row[key] !== '') return row[key];
  }
  return '';
}
function buildDebtorRow(r){
  return {
    name: String(pickField(r,['name','debtor','customer','debtor name','customer name'])||'').trim(),
    contact: String(pickField(r,['contact','phone','tel','telephone','phone number'])||'').trim(),
    branch: String(pickField(r,['branch','location','office','branch name'])||'').trim(),
    department: String(pickField(r,['department','dept'])||'').trim(),
    balance: parseMoney(pickField(r,['balance','opening balance','current balance','outstanding','outstanding balance','amount','amount owed','debt','balance due'])),
    notes: String(pickField(r,['notes','note','remarks','comment','comments'])||'').trim(),
  };
}
function importDebtorsFile(input){
  const file = input.files[0];
  if(!file) return;
  const finish = rows=>{
    if(!rows.length){ toast('No valid rows found','err'); return; }
    let newBranches = 0;
    mutate(s=>{
      rows.forEach(r=>{
        let branch = s.branches.find(b=>b.name.trim().toLowerCase()===(r.branch||'').trim().toLowerCase());
        if(!branch && r.branch){ branch = {id:uid(), name:r.branch.trim(), code:r.branch.trim().slice(0,4).toUpperCase()}; s.branches.push(branch); newBranches++; }
        if(!branch) branch = s.branches[0];
        s.customers.push({id:uid(), name:r.name, contact:r.contact, branchId:branch.id, department:r.department, balance:r.balance||0, notes:r.notes||'', createdAt:todayStr()});
      });
    });
    toast(`Imported ${rows.length} debtors${newBranches? ` · ${newBranches} new branch(es) created`:''}`,'ok');
    input.value='';
  };
  const name = file.name.toLowerCase();
  if(name.endsWith('.xlsx') || name.endsWith('.xls')){
    const reader = new FileReader();
    reader.onload = evt=>{
      try{
        const wb = XLSX.read(evt.target.result, {type:'array'});
        const sheet = wb.Sheets[wb.SheetNames[0]];
        const json = XLSX.utils.sheet_to_json(sheet, {defval:''});
        const rows = json.map(buildDebtorRow).filter(r=>r.name);
        finish(rows);
      }catch(e){ toast('Could not read Excel file: '+e.message,'err'); }
    };
    reader.readAsArrayBuffer(file);
  } else {
    Papa.parse(file, {header:true, skipEmptyLines:true, complete: res=>{
      const rows = res.data.map(buildDebtorRow).filter(r=>r.name);
      finish(rows);
    }, error: err=>toast('CSV import failed: '+err.message,'err')});
  }
}

function allChequeRows(){

  state.entries.forEach(e=>{

    });
  });
  return rows;
}
function weekRangeOf(dateStr){
  const d = new Date((dateStr||todayStr())+'T00:00:00');
  const day = d.getDay();
  const diffToMonday = (day===0? -6 : 1-day);
  const monday = new Date(d); monday.setDate(d.getDate()+diffToMonday);
  const sunday = new Date(monday); sunday.setDate(monday.getDate()+6);
  const fmt = x=>x.toISOString().slice(0,10);
  return {start:fmt(monday), end:fmt(sunday)};
}
function weekRangeContains(anchorDate, due){
  const {start,end} = weekRangeOf(anchorDate);
  return due>=start && due<=end;
}
function chequeMatchesFilter(due){
  const f = ui.chequesFilter;
  if(!due) return false;
  if(f.mode==='daily') return due === f.date;
  if(f.mode==='weekly') return weekRangeContains(f.date, due);
  if(f.mode==='range') return (!f.from || due>=f.from) && (!f.to || due<=f.to);
  return true;
}

        </tbody>
      </table></div>
    </div>

  mutate(s=>{

function suggestDepositMatch(line){
  const candidates = state.deposits.filter(d=>d.bankId===line.bankId && !d.bankConfirmed);
  let best = null, bestDiff = Infinity;
  candidates.forEach(d=>{
    const amtDiff = Math.abs((parseFloat(d.amount)||0) - (parseFloat(line.amount)||0));
    if(amtDiff > 0.01) return;
    const dayDiff = Math.abs((new Date(d.date) - new Date(line.date)) / 86400000);
    if(dayDiff <= 5 && dayDiff < bestDiff){ bestDiff = dayDiff; best = d; }
  });
  return best;
}
function buildStatementRow(r, bankId){
  const amountRaw = pickField(r,['amount','credit','deposit','credit amount','paid in']);
  return {
    id: uid(), bankId,
    date: (function(){
      const raw = pickField(r,['date','transaction date','value date','posting date']);
      if(!raw) return '';
      if(raw instanceof Date) return raw.toISOString().slice(0,10);
      const s = String(raw).trim();
      const d = new Date(s);
      if(!isNaN(d)) return d.toISOString().slice(0,10);
      return s;
    })(),
    description: String(pickField(r,['description','narration','details','particulars','memo'])||'').trim(),
    amount: parseMoney(amountRaw),
    matchedDepositId: null,
  };
}
function importBankStatement(input, bankId){
  const file = input.files[0];
  if(!file) return;
  const finish = rows=>{
    const clean = rows.filter(r=>r.amount>0 && r.date);
    if(!clean.length){ toast('No credit/deposit lines with a date and amount were found','err'); return; }
    mutate(s=>{ s.bankStatementLines = s.bankStatementLines.concat(clean); });
    toast(`Imported ${clean.length} statement line(s)`,'ok');
    input.value='';
  };
  const name = file.name.toLowerCase();
  if(name.endsWith('.xlsx') || name.endsWith('.xls')){
    const reader = new FileReader();
    reader.onload = evt=>{
      try{
        const wb = XLSX.read(evt.target.result, {type:'array'});
        const sheet = wb.Sheets[wb.SheetNames[0]];
        const json = XLSX.utils.sheet_to_json(sheet, {defval:''});
        finish(json.map(r=>buildStatementRow(r, bankId)));
      }catch(e){ toast('Could not read Excel file: '+e.message,'err'); }
    };
    reader.readAsArrayBuffer(file);
  } else {
    Papa.parse(file, {header:true, skipEmptyLines:true, complete: res=>{
      finish(res.data.map(r=>buildStatementRow(r, bankId)));
    }, error: err=>toast('CSV import failed: '+err.message,'err')});
  }
}
async function importBankStatementPdf(input, bankId){
  const file = input.files[0];
  if(!file) return;
  if(!window.pdfjsLib){ toast('PDF reader failed to load — try a CSV/Excel export instead','err'); return; }
  try{
    toast('Reading PDF…');
    const buf = await file.arrayBuffer();
    const pdf = await pdfjsLib.getDocument({data:buf}).promise;
    let text = '';
    for(let i=1;i<=pdf.numPages;i++){
      const page = await pdf.getPage(i);
      const content = await page.getTextContent();
      text += content.items.map(it=>it.str).join(' ') + '\n\n';
    }
    ui.reconPdfText = text.trim() || '(No readable text found in this PDF — it may be a scanned image.)';
    ui.reconBankId = bankId;
    render();
    toast('PDF text extracted','ok');
  }catch(e){
    toast('Could not read PDF: '+e.message,'err');
  }
  input.value='';
}

function saveManualStatementLine(bankId){

function matchStatementLine(lineId, depositId){
  if(!depositId) return;
  mutate(s=>{
    const line = s.bankStatementLines.find(l=>l.id===lineId);
    const dep = s.deposits.find(d=>d.id===depositId);
    if(!line || !dep) return;
    line.matchedDepositId = depositId;
    dep.bankConfirmed = true;
    dep.bankConfirmedDate = line.date;
    dep.statementLineId = lineId;
  });
  toast('Matched — deposit marked as credited on bank statement','ok');
}
function unmatchStatementLine(lineId){
  mutate(s=>{
    const line = s.bankStatementLines.find(l=>l.id===lineId);
    if(!line) return;
    if(line.matchedDepositId){
      const dep = s.deposits.find(d=>d.id===line.matchedDepositId);
      if(dep){ dep.bankConfirmed=false; dep.bankConfirmedDate=null; dep.statementLineId=null; }
    }
    line.matchedDepositId = null;
  });
}
function deleteStatementLine(id){
  if(!confirm('Delete this statement line?')) return;
  mutate(s=>{
    const line = s.bankStatementLines.find(l=>l.id===id);
    if(line && line.matchedDepositId){
      const dep = s.deposits.find(d=>d.id===line.matchedDepositId);
      if(dep){ dep.bankConfirmed=false; dep.bankConfirmedDate=null; dep.statementLineId=null; }
    }
    s.bankStatementLines = s.bankStatementLines.filter(l=>l.id!==id);
  });
}

        <td class="right num">${state.customers.filter(c=>c.branchId===b.id).length}</td>
        <td class="right num">${state.entries.filter(e=>e.branchId===b.id).length}</td>
        <td class="right"><button class="icon-btn" onclick="openBranchModal('${b.id}')">✎</button><button class="icon-btn" onclick="deleteBranch('${b.id}')">✕</button></td>
      </tr>`).join('') : `<tr><td colspan="6" class="empty">No branches yet.</td></tr>`}

    ${sel.length? `<p class="section-intro">Branches with debtors, register entries, or assigned users are skipped when bulk-deleting — reassign or clear their data first, or delete them individually after cleaning up.</p>`:''}
  `;
}
function toggleBranchSelect(id){
  const i = ui.selectedBranchIds.indexOf(id);
  if(i>=0) ui.selectedBranchIds.splice(i,1); else ui.selectedBranchIds.push(id);
  render();
}
function toggleSelectAllBranches(checked){
  ui.selectedBranchIds = checked ? state.branches.map(b=>b.id) : [];
  render();
}
function branchInUse(id){
  return state.entries.some(e=>e.branchId===id) || state.customers.some(c=>c.branchId===id) || state.users.some(u=>u.branchId===id);
}
function bulkDeleteSelectedBranches(){
  const ids = ui.selectedBranchIds.slice();
  if(!ids.length){ toast('Select at least one branch first','err'); return; }
  const blocked = ids.filter(branchInUse);
  const deletable = ids.filter(id=>!branchInUse(id));
  if(!deletable.length){ toast('All selected branches have debtors, entries, or users tied to them','err'); return; }
  if(deletable.length >= state.branches.length){ toast('At least one branch must remain — deselect one to keep','err'); return; }
  const names = deletable.map(branchName).join(', ');
  const warn = blocked.length ? ` (${blocked.length} selected branch${blocked.length>1?'es':''} skipped — has data or users tied to it)` : '';
  if(!confirm(`Delete ${deletable.length} branch${deletable.length>1?'es':''}: ${names}?${warn}`)) return;
  mutate(s=>{ s.branches = s.branches.filter(b=>!deletable.includes(b.id)); });
  ui.selectedBranchIds = ui.selectedBranchIds.filter(id=>!deletable.includes(id));
  toast(`Deleted ${deletable.length} branch${deletable.length>1?'es':''}${blocked.length? `, skipped ${blocked.length}`:''}`, 'ok');
}
function openBranchModal(id){
  const b = id? state.branches.find(x=>x.id===id):null;
  ui.modal = {type:'branch', data: b? Object.assign({},b) : {id:null,name:'',code:''}};
  render();
}
function saveBranchFromModal(){
  const f = document.getElementById('branchForm');
  const d = ui.modal.data;
  if(!f.name.value.trim()){ toast('Branch name required','err'); return; }
  mutate(s=>{
    if(d.id){ const b = s.branches.find(x=>x.id===d.id); b.name=f.name.value.trim(); b.code=f.code.value.trim(); }
    else{ s.branches.push({id:uid(), name:f.name.value.trim(), code:f.code.value.trim()||f.name.value.trim().slice(0,4).toUpperCase()}); }
  });
  closeModal(); toast('Branch saved','ok');
}
function deleteBranch(id){
  if(branchInUse(id)){ toast('This branch has data or users tied to it — reassign or remove those first','err'); return; }
  if(state.branches.length<=1){ toast('At least one branch is required','err'); return; }
  if(!confirm('Delete this branch?')) return;
  mutate(s=>{ s.branches = s.branches.filter(b=>b.id!==id); });
  ui.selectedBranchIds = ui.selectedBranchIds.filter(x=>x!==id);
}

function tabSettings(){

  return `

      </div>
      <div class="card">
        <h3>Backup — keep a copy on your computer</h3>

        <div class="field-row">

          <label class="btn btn-outline" style="position:relative; overflow:hidden;">Upload / restore backup<input type="file" accept=".json" style="position:absolute; inset:0; opacity:0; cursor:pointer;" onchange="importJsonBackup(this)"></label>

      <p class="section-intro">Connect a Google Apps Script Web App (deployed from a Google Sheet) to push and pull this data. See <code>README.md</code> and <code>google-apps-script.gs</code> for setup.</p>
      <div class="field-row">
        <div class="field" style="flex:2;"><label>Web App URL</label><input id="syncUrl" placeholder="https://script.google.com/macros/s/AKfycb.../exec" value="${esc(s.url)}"></div>
        <div class="field" style="flex:1;"><label>Shared secret</label><input id="syncSecret" placeholder="from Apps Script properties" value="${esc(s.secret)}"></div>
      </div>
      <div class="field-row">
        <button class="btn btn-primary" onclick="saveSyncSettings()">Save connection</button>
        <button class="btn btn-outline" onclick="pushToSheets()">Push to Google Sheets</button>
        <button class="btn btn-outline" onclick="pullFromSheets()">Pull from Google Sheets</button>
      </div>
      ${state.meta.lastSyncedAt? `<div class="hint" style="margin-top:8px;">Last synced: ${new Date(state.meta.lastSyncedAt).toLocaleString()}</div>` : ''}
    </div>

    <div class="card">
      <h3>Deploy this app</h3>
      <ul class="helper-list">
        <li>Push this single file to a GitHub repository and enable <strong>GitHub Pages</strong> for a shareable link.</li>
        <li>Data stays on whichever device/browser opens it, unless Google Sheets sync is connected.</li>
        <li>Combine both: local JSON backups for safety, Google Sheets sync for sharing across devices/staff.</li>
      </ul>
    </div>
  `;
}
function syncStatusLabel(){ if(!state.sync.url) return 'Not connected'; return state.meta.lastSyncedAt? 'Connected' : 'Connected · not yet synced'; }
function syncPillClass(){ return !state.sync.url? 'pill-blue' : 'pill-green'; }
function syncDotClass(){ return !state.sync.url? 'sync-off' : 'sync-ok'; }
function exportJsonBackup(){
  const blob = new Blob([JSON.stringify(state,null,2)], {type:'application/json'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = `revenue-register-backup-${todayStr()}.json`;
  a.click();
  mutate(s=>{ s.meta.lastLocalBackupAt = new Date().toISOString(); });
  toast('Backup downloaded','ok');
}
function importJsonBackup(input){
  const file = input.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = () => {
    try{
      const parsed = JSON.parse(reader.result);
      if(!confirm('Restoring will REPLACE all current data on this device. Continue?')) return;
      state = Object.assign(defaultState(), parsed);
      state = loadStateMigrate(state);
      saveState();
      ui.currentUserId = null; ui.pendingLoginUserId = null;
      render();
      toast('Backup restored — please log in again','ok');
    }catch(e){ toast('Invalid backup file','err'); }
  };
  reader.readAsText(file);
}
function loadStateMigrate(s){
  if(!s.branches || !s.branches.length) s.branches=[{id:uid(),name:'Main Branch',code:'MAIN'}];
  const firstBranch = s.branches[0].id;
  (s.entries||[]).forEach(e=>{ if(!e.branchId) e.branchId=firstBranch; if(!e.chequeDetails) e.chequeDetails=[]; if(!e.multipleCheques) e.multipleCheques='N'; });
  (s.customers||[]).forEach(c=>{ if(!c.branchId) c.branchId=firstBranch; });
  (s.deposits||[]).forEach(d=>{ if(!d.branchId) d.branchId=firstBranch; });
  (s.momoConfirmations||[]).forEach(m=>{ if(!m.branchId) m.branchId=firstBranch; });
  if(!s.debtorAdjustments) s.debtorAdjustments=[];
  if(!s.bankStatementLines) s.bankStatementLines=[];
  (s.deposits||[]).forEach(d=>{ if(d.bankConfirmed===undefined) d.bankConfirmed=false; if(d.bankConfirmedDate===undefined) d.bankConfirmedDate=null; });
  (s.entries||[]).forEach(e=>{ (e.chequeDetails||[]).forEach(cd=>{ if(cd.dishonoured===undefined) cd.dishonoured=false; }); });
  if(!s.users) s.users=[];
  return s;
}
function resetAllData(){
  if(!confirm('This will erase ALL data on this device. Export a backup first if unsure. Continue?')) return;
  if(!confirm('Really reset everything?')) return;
  state = defaultState();
  saveState();
  ui.currentUserId = null; ui.pendingLoginUserId = null;
  render();
  toast('All data reset');
}
function saveSyncSettings(){
  const url = document.getElementById('syncUrl').value.trim();
  const secret = document.getElementById('syncSecret').value.trim();
  mutate(s=>{ s.sync.url = url; s.sync.secret = secret; });
  toast('Sync settings saved','ok');
}
async function pushToSheets(){
  if(!state.sync.url){ toast('Add a Web App URL first','err'); return; }
  try{
    toast('Pushing to Google Sheets…');
    const res = await fetch(state.sync.url, {method:'POST', headers:{'Content-Type':'text/plain;charset=utf-8'}, body: JSON.stringify({secret: state.sync.secret, action:'push', data: state})});
    const json = await res.json();
    if(json.ok){ mutate(s=>{ s.meta.lastSyncedAt = new Date().toISOString(); }); toast('Pushed to Google Sheets','ok'); }
    else{ toast('Push failed: '+(json.error||'unknown error'),'err'); }
  }catch(e){ toast('Push failed: '+e.message,'err'); }
}
async function pullFromSheets(){
  if(!state.sync.url){ toast('Add a Web App URL first','err'); return; }
  if(!confirm('Pull will REPLACE local data with what is stored in Google Sheets. Continue?')) return;
  try{
    toast('Pulling from Google Sheets…');
    const res = await fetch(`${state.sync.url}?secret=${encodeURIComponent(state.sync.secret)}&action=pull`);
    const json = await res.json();
    if(json.ok && json.data){
      const url = state.sync.url, secret = state.sync.secret;
      state = Object.assign(defaultState(), json.data);
      state = loadStateMigrate(state);
      state.sync = {url, secret};
      state.meta.lastSyncedAt = new Date().toISOString();
      saveState();
      ui.currentUserId = null; ui.pendingLoginUserId = null;
      render();
      toast('Pulled from Google Sheets — please log in again','ok');
    } else{ toast('Pull failed: '+(json.error||'no data returned'),'err'); }
  }catch(e){ toast('Pull failed: '+e.message,'err'); }
}

      ${d.role==='finance_officer'? `<div class="field"><label>Branch</label><select name="branchId">${state.branches.map(b=>`<option value="${b.id}" ${b.id===d.branchId?'selected':''}>${esc(b.name)}</option>`).join('')}</select></div>` : `<input type="hidden" name="branchId" value="">`}
      <div class="field"><label>PIN ${d.id? '<span class="hint">leave blank to keep current PIN</span>':''}</label><input name="pin" type="password" inputmode="numeric" placeholder="${d.id?'••••':'4+ digits'}"></div>
    </form></div>
    <div class="modal-foot"><button class="btn btn-outline" onclick="closeModal()">Cancel</button><button class="btn btn-primary" onclick="saveUserFromModal()">Save user</button></div>
  </div>`;
}

function chequeDetailRowHTML(d){
  return `<tr data-id="${d.id}">
    <td><input type="date" class="grid-input cd-date" value="${d.receiptDate||''}"></td>
    <td><input type="text" class="grid-input cd-drawer" value="${esc(d.drawer||'')}" placeholder="Drawer / customer"></td>
    <td><input type="text" class="grid-input cd-bank" value="${esc(d.bank||'')}" placeholder="Bank"></td>
    <td><input type="text" class="grid-input cd-number" value="${esc(d.chequeNumber||'')}" placeholder="Cheque no."></td>
    <td><input type="number" step="0.01" min="0" class="grid-input cd-amount" value="${d.amount||''}" placeholder="Amount"></td>
    <td><input type="date" class="grid-input cd-due" value="${d.dueDate||''}"></td>
    <td class="right"><button type="button" class="icon-btn" onclick="removeChequeDetailRow('${d.id}')">✕</button></td>
  </tr>`;
}
function chequeDetailsModal(){
  const details = ui.chequeModalDraft||[];
  const multi = ui.chequeModalMulti||'N';
  const total = details.reduce((s,d)=>s+(parseFloat(d.amount)||0),0);
  return `<div class="modal wide">
    <div class="modal-head"><h3>Cheque details</h3><button class="close-x" onclick="closeChequeDetailsModal()">&times;</button></div>
    <div class="modal-body">
      <div class="field" style="margin-bottom:14px;">
        <label>Multiple cheques for this line?</label>
        <div class="seg" style="width:fit-content;">
          <button type="button" class="${multi==='N'?'active':''}" onclick="onChequeMultiChange('N')">N · Single</button>
          <button type="button" class="${multi==='Y'?'active':''}" onclick="onChequeMultiChange('Y')">Y · Multiple</button>
        </div>
      </div>
      <div class="table-wrap"><table id="chequeModalTable" class="grid-table">
        <thead><tr><th>Date received</th><th>Drawer / customer</th><th>Bank drawn on</th><th>Cheque no.</th><th class="right">Amount</th><th>Due date</th><th></th></tr></thead>
        <tbody>${details.map(chequeDetailRowHTML).join('')}</tbody>
      </table></div>
      ${multi==='Y'? `<button type="button" class="btn btn-outline btn-sm" style="margin-top:10px;" onclick="addChequeDetailRow()">+ Add another cheque</button>` : ''}
      <div class="divider"></div>
      <div class="right num" style="font-weight:700; font-size:15px;">Total: ${money(total)}</div>
    </div>
    <div class="modal-foot"><button class="btn btn-outline" onclick="closeChequeDetailsModal()">Cancel</button><button class="btn btn-primary" onclick="saveChequeDetailsModal()">Save cheque details</button></div>
  </div>`;
}
function chequeViewModal(entryId){
  const e = state.entries.find(x=>x.id===entryId);
  const details = e? (e.chequeDetails||[]) : [];
  return `<div class="modal wide">
    <div class="modal-head"><h3>Cheque details — ${fmtDate(e?e.date:'')}</h3><button class="close-x" onclick="closeModal()">&times;</button></div>
    <div class="modal-body"><div class="table-wrap"><table>
      <thead><tr><th>Date received</th><th>Drawer</th><th>Bank</th><th>Cheque no.</th><th class="right">Amount</th><th>Due date</th><th>Status</th></tr></thead>
      <tbody>${details.length? details.map(d=>`<tr><td>${fmtDate(d.receiptDate)}</td><td>${esc(d.drawer)}</td><td>${esc(d.bank)}</td><td class="mono-sm">${esc(d.chequeNumber)}</td><td class="right num">${money(d.amount)}</td><td>${fmtDate(d.dueDate)}</td><td>${d.dishonoured?'<span class="pill pill-red">Dishonoured</span>':(d.presented?'<span class="pill pill-green">Presented</span>':'<span class="pill pill-amber">Pending</span>')}</td></tr>`).join('') : `<tr><td colspan="7" class="empty">No cheque details recorded.</td></tr>`}</tbody>
    </table></div></div>
    <div class="modal-foot"><button class="btn btn-outline" onclick="closeModal()">Close</button></div>
  </div>`;
}
function debtorStatementModal(customerId){
  const c = state.customers.find(x=>x.id===customerId);
  if(!c) return `<div class="modal"><div class="modal-body">Debtor not found.</div></div>`;
  const {movements, balance} = computeDebtorLedger(customerId);
  return `<div class="modal wide">
    <div class="modal-head"><h3>${esc(c.name)} — statement</h3><button class="close-x" onclick="closeModal()">&times;</button></div>
    <div class="modal-body">
      <div class="field-row" style="margin-bottom:6px;">
        <div class="muted">${esc(branchName(c.branchId))}${c.department? ' · '+esc(c.department):''}${c.contact? ' · '+esc(c.contact):''}</div>
      </div>
      <div class="table-wrap"><table>
        <thead><tr><th>Date</th><th>Movement</th><th class="right">Amount</th><th class="right">Running balance</th></tr></thead>
        <tbody>${movements.map(m=>`<tr><td>${fmtDate(m.date)}</td><td>${esc(m.type)}</td><td class="right num ${m.amount<0?'pos':''}">${money(m.amount)}</td><td class="right num" style="font-weight:600;">${money(m.balance)}</td></tr>`).join('')}</tbody>
      </table></div>
      <div class="right num" style="font-weight:700; font-size:15px; margin-top:10px;">Current balance: ${money(balance)}</div>
      ${isAdmin()? `
      <div class="divider"></div>
      <h3 style="margin-bottom:10px;">Record an adjustment</h3>
      <div class="field-row">
        <div class="field"><label>Type</label><select id="adjType"><option value="increase">Increase debt</option><option value="decrease">Decrease debt</option></select></div>
        <div class="field"><label>Amount</label><input id="adjAmount" type="number" step="0.01"></div>
        <div class="field"><label>Date</label><input id="adjDate" type="date" value="${todayStr()}"></div>
      </div>
      <div class="field"><label>Note</label><input id="adjNote" placeholder="reason for adjustment"></div>
      <button class="btn btn-outline btn-sm" onclick="saveDebtorAdjustment('${customerId}')">Record adjustment</button>
      ` : ''}
    </div>
    <div class="modal-foot"><button class="btn btn-outline" onclick="closeModal()">Close</button></div>
  </div>`;
}

/* ================= util: csv ================= */
function downloadCsv(rows, filename){
  const csv = rows.map(r=>r.map(v=>{
    const s = String(v==null?'':v);
    return /[",\n]/.test(s) ? '"'+s.replace(/"/g,'""')+'"' : s;
  }).join(',')).join('\n');
  const blob = new Blob([csv], {type:'text/csv'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = filename;
  a.click();
}

render();
</script>
</body>
</html>
